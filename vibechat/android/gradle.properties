org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── Настройки сборки VibeChat ────────────────────────────────
# Адрес вашего развёрнутого сервера (обязательно https://).
# Если оставить пустым, приложение при первом запуске попросит ввести адрес.
# Можно переопределить при сборке: ./gradlew assembleRelease -PvibechatServerUrl=https://...
vibechatServerUrl=
vibechatAppName=VibeChat
vibechatApplicationId=com.vibechat.app
vibechatVersionCode=1
vibechatVersionName=1.0.0
